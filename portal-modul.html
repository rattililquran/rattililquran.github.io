<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-bg:#f8fafc;--c-card:#ffffff;--c-ink:#0c1825;--c-ink-2:#3d5166;--c-ink-3:#64748b;
  --c-primary:#0284c7;--c-line:#e2e8f0;--r-lg:24px;--sh:0 18px 44px -22px rgba(15,23,42,.28);
  --c-nav:rgba(255,255,255,.86);--grad:linear-gradient(135deg,#0284c7,#6366f1)
}
html.theme-dark{
  --c-bg:#070e1c;--c-card:#0d1b30;--c-ink:#f1f5f9;--c-ink-2:#cbd5e1;--c-ink-3:#94a3b8;
  --c-line:rgba(255,255,255,.10);--c-nav:rgba(13,27,48,.86)
}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--c-bg);color:var(--c-ink);
  display:grid;place-items:center;padding:28px 20px;line-height:1.65;-webkit-font-smoothing:antialiased}
.box{max-width:520px;width:100%;text-align:center}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:850;font-size:16px;letter-spacing:.02em;
  text-transform:uppercase;color:var(--c-ink);text-decoration:none;margin-bottom:26px}
.brand img{height:32px;width:auto;display:block}
.brand picture{line-height:0;font-size:0}
h1{font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.025em;line-height:1.2}
p.lead{color:var(--c-ink-2);font-size:15px;margin-top:12px}
.cards{display:grid;gap:14px;margin-top:30px;text-align:left}
.card{display:flex;align-items:center;gap:16px;padding:20px;background:var(--c-card);border:1px solid var(--c-line);
  border-radius:var(--r-lg);box-shadow:var(--sh);text-decoration:none;color:inherit;transition:.2s}
.card:hover{border-color:var(--c-primary);transform:translateY(-2px)}
.card b{display:block;font-size:16.5px;font-weight:800}
.card span{display:block;color:var(--c-ink-3);font-size:14px;margin-top:3px}
.card .go{margin-left:auto;color:var(--c-primary);font-weight:700;font-size:20px;flex:0 0 auto}
.card .no{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  font-family:ui-monospace,monospace;font-size:13px;font-weight:700;color:#fff;background:var(--grad)}
.tip{margin-top:24px;color:var(--c-ink-3);font-size:13.5px}
.tip a{color:var(--c-primary);font-weight:700}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}

</style>
</head>

      <span>RATTILIL<span style="color:#dc2626">QUR'AN</span></span>

          <span>Presensi, raport, dan progres belajar dalam satu akun.</span>
        </span>
        <span class="go" aria-hidden="true">&rsaquo;</span>
      </a>

        <span class="no">02</span>

        <span class="go" aria-hidden="true">&rsaquo;</span>
      </a>
    </div>

    <p class="tip">Tidak teralihkan otomatis? <a href="portal.html">Buka Portal Murid</a>.</p>
  </div>
